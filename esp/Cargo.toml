[package]
name = "esp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "esp32s3-firmware"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }

esp-hal = { version = "1.1.2", features = ["esp32s3", "unstable"] }

esp-backtrace = { version = "0.18.1", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }

esp-println = { version = "0.16.1", default-features = false, features = [
    "esp32s3",
    "jtag-serial",
    "critical-section",
] }

esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }

esp-hal-servo = { version = "0.4.0", default-features = false, features = [
    "esp32s3",
] }
embedded-hal = "1.0.0"
